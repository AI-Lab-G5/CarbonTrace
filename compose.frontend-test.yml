# Ambiente local de integração; não altera contrato ou Rules do backend.
services:
  firebase-emulator:
    command: sh -c "npm install -g firebase-tools && firebase emulators:start --only auth,firestore --project demo-carbontrace"
  backend:
    environment:
      GCLOUD_PROJECT: demo-carbontrace
      GOOGLE_CLOUD_PROJECT: demo-carbontrace
