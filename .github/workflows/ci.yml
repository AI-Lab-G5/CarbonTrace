# .github/workflows/ci.yml
name: CI

on:
  push:
    # `dev` entrou em 02/11: merge de PR para dentro dela nao dispara
    # `pull_request` (o PR ja foi fechado) e antes tambem nao era push
    # para a main. O PR #27 entrou na dev sem nenhum check rodar.
    branches: [main, dev]
  pull_request:
  # Rodada manual, para reexecutar sem precisar de commit novo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint do contrato OpenAPI (gerado pelo backend, normalizado antes do lint)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências de documentação
        run: pip install pyyaml

      - name: Normalizar contrato OpenAPI
        run: python scripts/patch_openapi.py

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml

  # Backend: lint + testes unitários. Os testes que exigem emulador pulam
  # sozinhos aqui (skipif) e entram de verdade no job da Fase 2.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instala dependências
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check .
        working-directory: backend

      - name: Testes unitários
        run: pytest -v
        working-directory: backend

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Testes frontend
        run: npm test
        working-directory: frontend

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Identificar versão publicada
        working-directory: frontend
        run: |
          node -e "require('fs').writeFileSync('dist/version.json', JSON.stringify({sha: process.env.GITHUB_SHA}))"

      - name: Guardar build para publicação
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deny-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java (exigido pelo emulador do Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instala dependencias do backend
        run: pip install -r backend/requirements.txt

      - name: Instala Firebase CLI
        run: npm install -g firebase-tools

      - name: Sobe Auth e Firestore Emulator
        run: |
          # Sai do diretorio raiz porque firebase.json e as rules vivem em
          # firebase/. O `cd` fica dentro do passo: `working-directory`
          # mudaria o cwd so deste passo, mas o processo em background
          # precisa continuar rodando depois que o passo termina.
          cd firebase
          firebase emulators:start --only auth,firestore --project demo-carbontrace &
          # Espera as portas 8080 (Firestore) e 9099 (Auth) responderem.
          # "processo iniciado" nao e o mesmo que "pronto para responder",
          # e um sleep fixo erra tanto para mais quanto para menos.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:9099/ > /dev/null 2>&1; then
              echo "Emuladores prontos apos ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Emuladores nao subiram em 60s"
          exit 1

      - name: Cria contas de demonstracao
        run: python backend/scripts/seed_contas.py
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_PROJECT_ID: demo-carbontrace

      - name: Semeia fatores e unidades
        run: python backend/scripts/seed.py
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-carbontrace

      - name: Prova deny-all das Security Rules
        run: pytest qa/test_deny_all.py -v
        env:
          FIREBASE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_PROJECT_ID: demo-carbontrace

  hosting:
    name: Publicar Firebase Hosting
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-backend
      - lint-frontend
      - build-frontend
      - deny-all
      - gitleaks

    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main')

    permissions:
      contents: read
      checks: write
      pull-requests: write

    concurrency:
      group: hosting-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Recuperar build aprovado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: firebase/dist

      - name: Publicar preview e comentar no PR
        id: preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBONTRACE_C6FD6 }}
          projectId: carbontrace-c6fd6
          entryPoint: firebase
          expires: 7d

      - name: Publicar produção
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARBONTRACE_C6FD6 }}
          projectId: carbontrace-c6fd6
          entryPoint: firebase
          channelId: live

      - name: Smoke do frontend publicado
        timeout-minutes: 4
        env:
          DEPLOY_URL: ${{ steps.preview.outputs.details_url || 'https://carbontrace-c6fd6.web.app' }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.DEPLOY_URL.replace(/\/$/, '');
          const expected = process.env.GITHUB_SHA;
          const deadline = Date.now() + 180_000;
          let attempt = 0;

          while (Date.now() < deadline) {
            attempt++;
            try {
              const query = `smoke=${expected}-${Date.now()}`;
              const options = () => ({
                signal: AbortSignal.timeout(10_000),
                headers: { 'Cache-Control': 'no-cache' },
              });

              const [home, version] = await Promise.all([
                fetch(`${base}/?${query}`, options()),
                fetch(`${base}/version.json?${query}`, options()),
              ]);

              console.log(
                `Tentativa ${attempt}: página=${home.status}, versão=${version.status}`
              );

              if (!home.ok || !version.ok) {
                throw new Error('Hosting ainda não respondeu com sucesso');
              }

              const data = await version.json();
              if (data.sha !== expected) {
                throw new Error(`Versão recebida: ${data.sha}; esperada: ${expected}`);
              }

              console.log(`Smoke aprovado para o commit: ${expected}`);
              process.exit(0);
            } catch (error) {
              console.log(`Aguardando publicação: ${error.message}`);
            }

            await new Promise(resolve => setTimeout(resolve, 5_000));
          }

          throw new Error('Smoke falhou: versão esperada indisponível após 3 minutos');
          NODE

  render:
    name: Publicar API no Render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - lint
      - test-backend
      - lint-frontend
      - build-frontend
      - deny-all
      - gitleaks

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    concurrency:
      group: render-production
      cancel-in-progress: false

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publicar e verificar API
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_URL: https://carbontrace-api-tyn2.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.GITHUB_SHA;
          const base = process.env.API_URL;
          const secret = process.env.RENDER_DEPLOY_HOOK;

          if (!secret) {
            throw new Error('Secret RENDER_DEPLOY_HOOK não configurado');
          }

          const hook = new URL(secret);
          hook.searchParams.set('ref', expected);

          let trigger;
          try {
            trigger = await fetch(hook, {
              method: 'POST',
              signal: AbortSignal.timeout(30_000),
            });
          } catch {
            throw new Error('Não foi possível confirmar o disparo do deploy');
          }

          if (!trigger.ok) {
            throw new Error(`Render recusou o deploy: HTTP ${trigger.status}`);
          }

          console.log(`Deploy solicitado para o commit ${expected}`);
          const deadline = Date.now() + 15 * 60_000;

          while (Date.now() < deadline) {
            try {
              const options = () => ({
                signal: AbortSignal.timeout(10_000),
                headers: { 'Cache-Control': 'no-cache' },
              });
              const query = `smoke=${Date.now()}`;
              const health = await fetch(
                `${base}/healthz?${query}`, options()
              );

              if (!health.ok) {
                throw new Error(`Health: HTTP ${health.status}`);
              }

              const data = await health.json();

              if (data.commit !== expected) {
                throw new Error('A versão esperada ainda não está disponível');
              }

              if (data.status !== 'ok' || data.emulador !== false) {
                throw new Error('Saúde ou configuração de produção inválida');
              }

              const ready = await fetch(
                `${base}/readyz?${query}`, options()
              );

              if (!ready.ok || (await ready.json()).status !== 'pronto') {
                throw new Error('Firestore ainda não está pronto');
              }

              console.log(`Smoke da API aprovado: ${expected}`);
              process.exit(0);
            } catch (error) {
              console.log(`Aguardando API: ${error.message}`);
            }

            await new Promise(resolve => setTimeout(resolve, 10_000));
          }

          throw new Error('Deploy não ficou saudável na versão esperada em 15 minutos');
          NODE

  gitleaks:
    name: Verificar segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar e executar Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"

          curl --fail --silent --show-error --location \
            --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tool_dir/gitleaks.tar.gz"

          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check -

          tar -xzf "$tool_dir/gitleaks.tar.gz" \
            -C "$tool_dir" gitleaks

          "$tool_dir/gitleaks" git \
            --redact=100 \
            --verbose \
            --exit-code 1 \
            --log-opts="--all" \
            .
