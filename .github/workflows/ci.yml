# .github/workflows/ci.yml
name: CI

on:
  push:
    # `dev` entrou em 02/11: merge de PR para dentro dela nao dispara
    # `pull_request` (o PR ja foi fechado) e antes tambem nao era push
    # para a main. O PR #27 entrou na dev sem nenhum check rodar.
    branches: [main, dev]
  pull_request:
  # Rodada manual, para reexecutar sem precisar de commit novo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint do contrato OpenAPI (gerado pelo backend, normalizado antes do lint)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências de documentação
        run: pip install pyyaml

      - name: Normalizar contrato OpenAPI
        run: python scripts/patch_openapi.py

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml

  # Backend: lint + testes unitários. Os testes que exigem emulador pulam
  # sozinhos aqui (skipif) e entram de verdade no job da Fase 2.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instala dependências
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check .
        working-directory: backend

      - name: Testes unitários
        run: pytest -v
        working-directory: backend

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala dependências
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deny-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java (exigido pelo emulador do Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instala dependencias do backend
        run: pip install -r backend/requirements.txt

      - name: Instala Firebase CLI
        run: npm install -g firebase-tools

      - name: Sobe Auth e Firestore Emulator
        run: |
          # Sai do diretorio raiz porque firebase.json e as rules vivem em
          # firebase/. O `cd` fica dentro do passo: `working-directory`
          # mudaria o cwd so deste passo, mas o processo em background
          # precisa continuar rodando depois que o passo termina.
          cd firebase
          firebase emulators:start --only auth,firestore --project demo-carbontrace &
          # Espera as portas 8080 (Firestore) e 9099 (Auth) responderem.
          # "processo iniciado" nao e o mesmo que "pronto para responder",
          # e um sleep fixo erra tanto para mais quanto para menos.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:9099/ > /dev/null 2>&1; then
              echo "Emuladores prontos apos ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Emuladores nao subiram em 60s"
          exit 1

      - name: Cria contas de demonstracao
        run: python backend/scripts/seed_contas.py
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_PROJECT_ID: demo-carbontrace

      - name: Semeia fatores e unidades
        run: python backend/scripts/seed.py
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-carbontrace

      - name: Prova deny-all das Security Rules
        run: pytest qa/test_deny_all.py -v
        env:
          FIREBASE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_PROJECT_ID: demo-carbontrace
