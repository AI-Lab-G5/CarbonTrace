# Stack de desenvolvimento do CarbonTrace.
# Permite a execução direta na raiz do repositório:
#   docker compose up --build

include:
  - infra/dev/docker-compose.yml

services:
  emuladores:
    image: node:20-slim
    working_dir: /firebase
    command: sh -c "npm install -g firebase-tools && firebase emulators:start --only auth,firestore"
    volumes:
      - ./firebase:/firebase
    ports:
      - "4000:4000"   # UI dos emuladores
      - "9099:9099"   # Auth
      - "8080:8080"   # Firestore
