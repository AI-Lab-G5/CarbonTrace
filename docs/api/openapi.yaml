openapi: 3.1.0
info:
  title: CarbonTrace API
  description: 'Inventario de emissoes de GEE para redes de varejo e franquias.


    Quantidades e fatores trafegam como texto, nao como numero decimal: o calculo
    e feito em Decimal do inicio ao fim para que dois recalculos do mesmo periodo
    devolvam exatamente o mesmo resultado.


    Todo dado de cliente vive sob /tenants/{tenantId}/ e o tenant vem das claims do
    ID token, nunca de parametro do cliente. Apenas /healthz e /readyz sao publicas.'
  version: 0.3.0
paths:
  /healthz:
    get:
      tags:
      - infra
      summary: Prova de vida do processo
      description: '**Rota publica, sem autenticacao.** Excecao acordada com o Tech
        Lead e registrada no CA-02: a sonda de liveness e chamada pelo orquestrador,
        que nao tem token, e precisa responder mesmo quando o Firebase Auth esta fora
        do ar -- se exigisse token, uma falha de autenticacao derrubaria a aplicacao
        inteira. Nao expoe nenhum dado de cliente.'
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /readyz:
    get:
      tags:
      - infra
      summary: Prontidao para atender
      description: '**Rota publica, sem autenticacao.** Mesma excecao do /healthz.
        Responde 200 quando o Firestore responde e 503 quando nao. A mensagem de erro
        do 503 nao inclui dado de cliente.'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readyz Readyz Get
  /v1/unidades:
    get:
      tags:
      - unidades
      summary: Listar
      operationId: listar_v1_unidades_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: proximo_cursor da pagina anterior
          title: Cursor
        description: proximo_cursor da pagina anterior
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_Unidade_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - unidades
      summary: Criar
      operationId: criar_v1_unidades_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Unidade'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/unidades/{unidade_id}:
    get:
      tags:
      - unidades
      summary: Obter
      operationId: obter_v1_unidades__unidade_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: unidade_id
        in: path
        required: true
        schema:
          type: string
          title: Unidade Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fontes:
    get:
      tags:
      - fontes
      summary: Listar
      description: 'Fontes vigentes na competencia pedida, ou no mes corrente.


        O front usa esta rota para montar o seletor de fonte e saber quais

        unidades de medida aceitar em cada uma.'
      operationId: listar_v1_fontes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Competencia
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fator'
                title: Response Listar V1 Fontes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fontes/versoes:
    get:
      tags:
      - fontes
      summary: Versoes
      operationId: versoes_v1_fontes_versoes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Versoes V1 Fontes Versoes Get
      security:
      - HTTPBearer: []
  /v1/fontes/versoes/{versao}:
    get:
      tags:
      - fontes
      summary: Obter Versao
      operationId: obter_versao_v1_fontes_versoes__versao__get
      security:
      - HTTPBearer: []
      parameters:
      - name: versao
        in: path
        required: true
        schema:
          type: string
          title: Versao
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersaoFatores'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consumos:
    get:
      tags:
      - consumos
      summary: Listar
      operationId: listar_v1_consumos_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Competencia
      - name: unidade_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Unidade Id
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: proximo_cursor da pagina anterior
          title: Cursor
        description: proximo_cursor da pagina anterior
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_Consumo_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - consumos
      summary: Registrar
      description: 'Grava ou atualiza um lancamento, ja calculado.


        PUT e nao POST porque a operacao e idempotente: o mesmo pedido

        repetido leva ao mesmo estado, sem lancamento duplicado.'
      operationId: registrar_v1_consumos_put
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumoEntrada'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consumos/{consumo_id}:
    get:
      tags:
      - consumos
      summary: Obter
      operationId: obter_v1_consumos__consumo_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: consumo_id
        in: path
        required: true
        schema:
          type: string
          title: Consumo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consumos/{consumo_id}/recalculo:
    post:
      tags:
      - consumos
      summary: Conferir Recalculo
      description: 'Refaz a conta com o fator original e confere contra o gravado.


        Prova do CA-03, disponivel para auditoria: mesmo que uma versao nova

        de fatores tenha sido publicada, este endpoint usa a versao que o

        lancamento registrou. O valor tem de bater com o guardado -- se

        divergir, ha defeito no motor de calculo, e 500 e a resposta certa

        porque o erro e nosso, nao de quem chamou.'
      operationId: conferir_recalculo_v1_consumos__consumo_id__recalculo_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consumo_id
        in: path
        required: true
        schema:
          type: string
          title: Consumo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consolidado:
    get:
      tags:
      - consolidado
      summary: '[Obsoleto] Consolidado calculado na leitura'
      description: Mantido para nao quebrar a tela atual. Recalcula varrendo os consumos
        da competencia a cada chamada, que e o custo que o CA-03 do CP3 pede para
        eliminar. Prefira GET /v1/agregados, que le o snapshot ja gravado. Ver ADR-010.
      operationId: obter_v1_consolidado_get
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: true
        schema:
          type: string
          description: Mes de referencia, formato AAAA-MM
          title: Competencia
        description: Mes de referencia, formato AAAA-MM
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consolidado'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/onboarding/resgate:
    post:
      tags:
      - onboarding
      summary: Resgate
      operationId: resgate_v1_onboarding_resgate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resgate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/onboarding/acesso:
    get:
      tags:
      - onboarding
      summary: Acesso
      operationId: acesso_v1_onboarding_acesso_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/snapshots:
    post:
      tags:
      - agregados
      summary: Gera o snapshot de uma competencia
      description: '201 quando nasce uma versao nova; 200 quando os lancamentos nao
        mudaram desde a ultima geracao -- nesse caso devolve o snapshot existente
        e `criado: false`, sem duplicar. Snapshot nunca e editado nem apagado: versoes
        anteriores ficam.'
      operationId: gerar_snapshot_v1_snapshots_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeracaoSnapshot'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotGerado'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - agregados
      summary: Listar Snapshots
      operationId: listar_snapshots_v1_snapshots_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Competencia
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_SnapshotResumo_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/snapshots/{snapshot_id}:
    get:
      tags:
      - agregados
      summary: Obter Snapshot
      operationId: obter_snapshot_v1_snapshots__snapshot_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          title: Snapshot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/snapshots/{snapshot_id}/unidades:
    get:
      tags:
      - agregados
      summary: Linhas por unidade de um snapshot
      description: 'Paginado por cursor. O total do snapshot nao depende da pagina:
        ele ja esta em GET /v1/snapshots/{snapshot_id}.'
      operationId: listar_unidades_v1_snapshots__snapshot_id__unidades_get
      security:
      - HTTPBearer: []
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          title: Snapshot Id
      - name: regiao
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra por UF
          title: Regiao
        description: Filtra por UF
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_LinhaUnidade_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/snapshots/{snapshot_id}/comparacao:
    get:
      tags:
      - agregados
      summary: Ranking e desvio contra a mediana (CA-06)
      description: 'Elegivel: unidade ativa com pelo menos uma fonte lancada. Alerta
        so quando o desvio absoluto passa de 50%, com no minimo 3 elegiveis e mediana
        positiva; exatamente +/-50% nao alerta. Fora disso, `disponivel: false` com
        o motivo.'
      operationId: obter_comparacao_v1_snapshots__snapshot_id__comparacao_get
      security:
      - HTTPBearer: []
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          title: Snapshot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparacaoSaida'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agregados:
    get:
      tags:
      - agregados
      summary: O snapshot vigente de uma competencia
      description: 'Atalho para o dashboard: devolve a maior versao gravada da competencia,
        sem precisar listar antes. 404 quando a competencia ainda nao teve snapshot
        gerado -- a leitura nunca gera um por conta propria.'
      operationId: obter_agregado_vigente_v1_agregados_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: true
        schema:
          type: string
          description: Mes de referencia, formato AAAA-MM
          title: Competencia
        description: Mes de referencia, formato AAAA-MM
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/empresas:
    post:
      tags:
      - empresas
      summary: Cadastra uma empresa com codigo unico
      operationId: cadastrar_v1_empresas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaEntrada'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '409':
          description: Codigo ja usado por outra empresa
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/empresas/{codigo}:
    get:
      tags:
      - empresas
      summary: Consulta uma empresa pelo codigo
      description: 'Publico para quem esta autenticado: serve para a tela de cadastro
        dizer se um codigo esta livre antes de enviar. Devolve apenas codigo e nome
        -- nenhum dado de consumo.'
      operationId: obter_v1_empresas__codigo__get
      security:
      - HTTPBearer: []
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          title: Codigo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ComparacaoSaida:
      properties:
        competencia:
          type: string
          title: Competencia
        snapshot_id:
          type: string
          title: Snapshot Id
        disponivel:
          type: boolean
          title: Disponivel
        motivo:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo
        mediana_kg_co2e:
          type: string
          title: Mediana Kg Co2E
        elegiveis:
          type: integer
          title: Elegiveis
        linhas:
          items:
            $ref: '#/components/schemas/LinhaComparacaoSaida'
          type: array
          title: Linhas
      type: object
      required:
      - competencia
      - snapshot_id
      - disponivel
      - mediana_kg_co2e
      - elegiveis
      - linhas
      title: ComparacaoSaida
      description: 'Ranking e desvio contra a mediana (CA-06).


        `disponivel=False` nao e erro: a rede nao tem base de comparacao.

        O motivo acompanha para a tela poder explicar.'
    Consolidado:
      properties:
        competencia:
          type: string
          title: Competencia
        total_kg_co2e:
          type: string
          title: Total Kg Co2E
        mediana_kg_co2e:
          type: string
          title: Mediana Kg Co2E
        por_unidade:
          items:
            $ref: '#/components/schemas/LinhaConsolidado'
          type: array
          title: Por Unidade
      type: object
      required:
      - competencia
      - total_kg_co2e
      - mediana_kg_co2e
      - por_unidade
      title: Consolidado
      description: Agregado da rede numa competencia.
    Consumo:
      properties:
        criado_por_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Criado Por Uid
        criado_em:
          anyOf:
          - type: string
          - type: 'null'
          title: Criado Em
          description: ISO 8601 UTC
        atualizado_por_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Atualizado Por Uid
        atualizado_em:
          anyOf:
          - type: string
          - type: 'null'
          title: Atualizado Em
          description: ISO 8601 UTC
        id:
          type: string
          title: Id
        unidade_id:
          type: string
          title: Unidade Id
        competencia:
          type: string
          title: Competencia
        fonte_id:
          type: string
          title: Fonte Id
        quantidade_informada:
          type: string
          title: Quantidade Informada
        unidade_informada:
          type: string
          title: Unidade Informada
        quantidade_convertida:
          type: string
          title: Quantidade Convertida
        unidade_base:
          type: string
          title: Unidade Base
        fator_versao:
          type: string
          title: Fator Versao
        fator_valor:
          type: string
          title: Fator Valor
        emissao_kg_co2e:
          type: string
          title: Emissao Kg Co2E
        escopo:
          type: string
          enum:
          - '1'
          - '2'
          title: Escopo
      type: object
      required:
      - id
      - unidade_id
      - competencia
      - fonte_id
      - quantidade_informada
      - unidade_informada
      - quantidade_convertida
      - unidade_base
      - fator_versao
      - fator_valor
      - emissao_kg_co2e
      - escopo
      title: Consumo
      description: 'Lancamento ja calculado e persistido.


        Guarda a versao e o valor do fator aplicado. E o que permite

        recalcular o periodo depois, com o fator da epoca, e obter o

        mesmo numero.'
    ConsumoEntrada:
      properties:
        unidade_id:
          type: string
          minLength: 1
          title: Unidade Id
        competencia:
          type: string
          title: Competencia
          description: Mes de referencia, formato AAAA-MM
        fonte_id:
          type: string
          minLength: 1
          title: Fonte Id
        quantidade:
          anyOf:
          - type: number
          - type: string
          title: Quantidade
          description: 'Texto, ex.: "1500.5"'
        unidade_medida:
          type: string
          maxLength: 10
          minLength: 1
          title: Unidade Medida
      type: object
      required:
      - unidade_id
      - competencia
      - fonte_id
      - quantidade
      - unidade_medida
      title: ConsumoEntrada
      description: Lancamento mensal de uma fonte numa unidade.
    Empresa:
      properties:
        criado_por_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Criado Por Uid
        criado_em:
          anyOf:
          - type: string
          - type: 'null'
          title: Criado Em
          description: ISO 8601 UTC
        atualizado_por_uid:
          anyOf:
          - type: string
          - type: 'null'
          title: Atualizado Por Uid
        atualizado_em:
          anyOf:
          - type: string
          - type: 'null'
          title: Atualizado Em
          description: ISO 8601 UTC
        codigo:
          type: string
          title: Codigo
        nome:
          type: string
          title: Nome
