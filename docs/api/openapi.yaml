openapi: 3.1.0
info:
  title: CarbonTrace API
  description: 'Inventario de emissoes de GEE para redes de varejo e franquias.


    Quantidades e fatores trafegam como texto, nao como numero decimal: o calculo
    e feito em Decimal do inicio ao fim para que dois recalculos do mesmo periodo
    devolvam exatamente o mesmo resultado.


    Todo dado de cliente vive sob /tenants/{tenantId}/ e o tenant vem das claims do
    ID token, nunca de parametro do cliente. Apenas /healthz e /readyz sao publicas.'
  version: 0.2.0
paths:
  /healthz:
    get:
      tags:
      - infra
      summary: Prova de vida do processo
      description: '**Rota publica, sem autenticacao.** Excecao acordada com o Tech
        Lead e registrada no CA-02: a sonda de liveness e chamada pelo orquestrador,
        que nao tem token, e precisa responder mesmo quando o Firebase Auth esta fora
        do ar -- se exigisse token, uma falha de autenticacao derrubaria a aplicacao
        inteira. Nao expoe nenhum dado de cliente.'
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /readyz:
    get:
      tags:
      - infra
      summary: Prontidao para atender
      description: '**Rota publica, sem autenticacao.** Mesma excecao do /healthz.
        Responde 200 quando o Firestore responde e 503 quando nao. A mensagem de erro
        do 503 nao inclui dado de cliente.'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readyz Readyz Get
  /v1/unidades:
    get:
      tags:
      - unidades
      summary: Listar
      operationId: listar_v1_unidades_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: proximo_cursor da pagina anterior
          title: Cursor
        description: proximo_cursor da pagina anterior
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_Unidade_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - unidades
      summary: Criar
      operationId: criar_v1_unidades_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Unidade'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/unidades/{unidade_id}:
    get:
      tags:
      - unidades
      summary: Obter
      operationId: obter_v1_unidades__unidade_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: unidade_id
        in: path
        required: true
        schema:
          type: string
          title: Unidade Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unidade'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fontes:
    get:
      tags:
      - fontes
      summary: Listar
      description: 'Fontes vigentes na competencia pedida, ou no mes corrente.


        O front usa esta rota para montar o seletor de fonte e saber quais

        unidades de medida aceitar em cada uma.'
      operationId: listar_v1_fontes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Competencia
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fator'
                title: Response Listar V1 Fontes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fontes/versoes:
    get:
      tags:
      - fontes
      summary: Versoes
      operationId: versoes_v1_fontes_versoes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Versoes V1 Fontes Versoes Get
      security:
      - HTTPBearer: []
  /v1/fontes/versoes/{versao}:
    get:
      tags:
      - fontes
      summary: Obter Versao
      operationId: obter_versao_v1_fontes_versoes__versao__get
      security:
      - HTTPBearer: []
      parameters:
      - name: versao
        in: path
        required: true
        schema:
          type: string
          title: Versao
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersaoFatores'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consumos:
    get:
      tags:
      - consumos
      summary: Listar
      operationId: listar_v1_consumos_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Competencia
      - name: unidade_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Unidade Id
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: proximo_cursor da pagina anterior
          title: Cursor
        description: proximo_cursor da pagina anterior
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagina_Consumo_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - consumos
      summary: Registrar
      description: 'Grava ou atualiza um lancamento, ja calculado.


        PUT e nao POST porque a operacao e idempotente: o mesmo pedido

        repetido leva ao mesmo estado, sem lancamento duplicado.'
      operationId: registrar_v1_consumos_put
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumoEntrada'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consumos/{consumo_id}:
    get:
      tags:
      - consumos
      summary: Obter
      operationId: obter_v1_consumos__consumo_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: consumo_id
        in: path
        required: true
        schema:
          type: string
          title: Consumo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consumos/{consumo_id}/recalculo:
    post:
      tags:
      - consumos
      summary: Conferir Recalculo
      description: 'Refaz a conta com o fator original e confere contra o gravado.


        Prova do CA-03, disponivel para auditoria: mesmo que uma versao nova

        de fatores tenha sido publicada, este endpoint usa a versao que o

        lancamento registrou. O valor tem de bater com o guardado -- se

        divergir, ha defeito no motor de calculo, e 500 e a resposta certa

        porque o erro e nosso, nao de quem chamou.'
      operationId: conferir_recalculo_v1_consumos__consumo_id__recalculo_post
      security:
      - HTTPBearer: []
      parameters:
      - name: consumo_id
        in: path
        required: true
        schema:
          type: string
          title: Consumo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/consolidado:
    get:
      tags:
      - consolidado
      summary: Obter
      operationId: obter_v1_consolidado_get
      security:
      - HTTPBearer: []
      parameters:
      - name: competencia
        in: query
        required: true
        schema:
          type: string
          description: Mes de referencia, formato AAAA-MM
          title: Competencia
        description: Mes de referencia, formato AAAA-MM
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consolidado'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Consolidado:
      properties:
        competencia:
          type: string
          title: Competencia
        total_kg_co2e:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Kg Co2E
        mediana_kg_co2e:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Mediana Kg Co2E
        por_unidade:
          items:
            $ref: '#/components/schemas/LinhaConsolidado'
          type: array
          title: Por Unidade
      type: object
      required:
      - competencia
      - total_kg_co2e
      - mediana_kg_co2e
      - por_unidade
      title: Consolidado
      description: Agregado da rede numa competencia.
    Consumo:
      properties:
        id:
          type: string
          title: Id
        unidade_id:
          type: string
          title: Unidade Id
        competencia:
          type: string
          title: Competencia
        fonte_id:
          type: string
          title: Fonte Id
        quantidade_informada:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Quantidade Informada
        unidade_informada:
          type: string
          title: Unidade Informada
        quantidade_convertida:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Quantidade Convertida
        unidade_base:
          type: string
          title: Unidade Base
        fator_versao:
          type: string
          title: Fator Versao
        fator_valor:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Fator Valor
        emissao_kg_co2e:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Emissao Kg Co2E
        escopo:
          type: string
          enum:
          - '1'
          - '2'
          title: Escopo
      type: object
      required:
      - id
      - unidade_id
      - competencia
      - fonte_id
      - quantidade_informada
      - unidade_informada
      - quantidade_convertida
      - unidade_base
      - fator_versao
      - fator_valor
      - emissao_kg_co2e
      - escopo
      title: Consumo
      description: 'Lancamento ja calculado e persistido.


        Guarda a versao e o valor do fator aplicado. E o que permite

        recalcular o periodo depois, com o fator da epoca, e obter o

        mesmo numero.'
    ConsumoEntrada:
      properties:
        unidade_id:
          type: string
          minLength: 1
          title: Unidade Id
        competencia:
          type: string
          title: Competencia
          description: Mes de referencia, formato AAAA-MM
        fonte_id:
          type: string
          minLength: 1
          title: Fonte Id
        quantidade:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Quantidade
          description: 'Texto, ex.: "1500.5"'
        unidade_medida:
          type: string
          maxLength: 10
          minLength: 1
          title: Unidade Medida
      type: object
      required:
      - unidade_id
      - competencia
      - fonte_id
      - quantidade
      - unidade_medida
      title: ConsumoEntrada
      description: Lancamento mensal de uma fonte numa unidade.
    Fator:
      properties:
        fonte_id:
          type: string
          title: Fonte Id
        nome:
          type: string
          title: Nome
        escopo:
          type: string
          enum:
          - '1'
          - '2'
          title: Escopo
        unidade_base:
          type: string
          title: Unidade Base
        unidades_aceitas:
          items:
            type: string
          type: array
          title: Unidades Aceitas
        kg_co2e_por_unidade:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Kg Co2E Por Unidade
        teto_mensal:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Teto Mensal
          description: 'Quantidade maxima aceita num lancamento mensal, na unidade
            base. Conferido DEPOIS da conversao de unidade: 1001 MWh sao comparados
            como 1.001.000 kWh. Valores vigentes: eletricidade 1000000 kWh, diesel
            200000 L, gasolina 100000 L, GLP 50000 kg. E um filtro contra erro de
            digitacao, nao um limite de negocio; o valor vem do catalogo e muda publicando
            versao nova.'
        fonte_referencia:
          type: string
          title: Fonte Referencia
        status:
          type: string
          enum:
          - preliminar
          - vigente
          - substituido
          title: Status
      type: object
      required:
      - fonte_id
      - nome
      - escopo
      - unidade_base
      - unidades_aceitas
      - kg_co2e_por_unidade
      - teto_mensal
      - fonte_referencia
      - status
      title: Fator
      description: Fator de conversao de uma fonte de emissao.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinhaConsolidado:
      properties:
        unidade_id:
          type: string
          title: Unidade Id
        unidade_nome:
          type: string
          title: Unidade Nome
        emissao_kg_co2e:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Emissao Kg Co2E
      type: object
      required:
      - unidade_id
      - unidade_nome
      - emissao_kg_co2e
      title: LinhaConsolidado
    Pagina_Consumo_:
      properties:
        itens:
          items:
            $ref: '#/components/schemas/Consumo'
          type: array
          title: Itens
        total_na_pagina:
          type: integer
          title: Total Na Pagina
        limite:
          type: integer
          title: Limite
        proximo_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Proximo Cursor
          description: Passe em 'cursor' para a proxima pagina. Nulo no fim.
      type: object
      required:
      - itens
      - total_na_pagina
      - limite
      title: Pagina[Consumo]
    Pagina_Unidade_:
      properties:
        itens:
          items:
            $ref: '#/components/schemas/Unidade'
          type: array
          title: Itens
        total_na_pagina:
          type: integer
          title: Total Na Pagina
        limite:
          type: integer
          title: Limite
        proximo_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Proximo Cursor
          description: Passe em 'cursor' para a proxima pagina. Nulo no fim.
      type: object
      required:
      - itens
      - total_na_pagina
      - limite
      title: Pagina[Unidade]
    Unidade:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        nome:
          type: string
          maxLength: 120
          minLength: 1
          title: Nome
        cidade:
          type: string
          maxLength: 120
          minLength: 1
          title: Cidade
        uf:
          type: string
          maxLength: 2
          minLength: 2
          title: Uf
      type: object
      required:
      - nome
      - cidade
      - uf
      title: Unidade
      description: Uma loja, filial ou franquia da rede.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VersaoFatores:
      properties:
        versao:
          type: string
          title: Versao
        vigencia_inicio:
          type: string
          title: Vigencia Inicio
        vigencia_fim:
          anyOf:
          - type: string
          - type: 'null'
          title: Vigencia Fim
        publicado_em:
          type: string
          title: Publicado Em
        status:
          type: string
          enum:
          - preliminar
          - vigente
          - substituido
          title: Status
        fatores:
          items:
            $ref: '#/components/schemas/Fator'
          type: array
          title: Fatores
      type: object
      required:
      - versao
      - vigencia_inicio
      - publicado_em
      - status
      - fatores
      title: VersaoFatores
      description: Conjunto imutavel de fatores, identificado por versao.
  securitySchemes:
    HTTPBearer:
      type: http
      description: ID token do Firebase
      scheme: bearer
